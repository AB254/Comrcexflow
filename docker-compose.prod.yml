services:
  # ============================================
  # Caddy - Reverse proxy with automatic HTTPS
  # ============================================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    environment:
      - APP_DOMAIN=${APP_DOMAIN}

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comrcexflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: comrcexflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comrcexflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Web App
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: production
      PORT: 3000
      PROCESS_TYPE: web
      DATABASE_URL: postgresql://comrcexflow:${POSTGRES_PASSWORD}@postgres:5432/comrcexflow?schema=public
      REDIS_URL: redis://redis:6379
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_APP_URL: https://${APP_DOMAIN}
      HOST: https://${APP_DOMAIN}
      SCOPES: write_products,read_orders,write_orders,read_checkouts,write_checkouts,read_customers
      MASTER_BYPASS_KEY: ${MASTER_BYPASS_KEY}
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - whatsapp_sessions:/app/.wwebjs_auth
      - whatsapp_cache:/app/.wwebjs_cache
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

  # ============================================
  # BullMQ Worker
  # ============================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: production
      PROCESS_TYPE: worker
      DATABASE_URL: postgresql://comrcexflow:${POSTGRES_PASSWORD}@postgres:5432/comrcexflow?schema=public
      REDIS_URL: redis://redis:6379
      SHOPIFY_APP_URL: http://web:3000
      INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET}
      MASTER_BYPASS_KEY: ${MASTER_BYPASS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  whatsapp_sessions:
  whatsapp_cache:
