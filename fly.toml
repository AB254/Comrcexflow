# Fly.io deployment config for ComrcexFlow
# Deploy with: fly launch / fly deploy

app = "comrcexflow"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  PROCESS_TYPE = "web"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

# Persistent volume for WhatsApp sessions
[[mounts]]
  source = "whatsapp_data"
  destination = "/app/.wwebjs_auth"
  initial_size = "1"
